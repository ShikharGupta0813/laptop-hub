<html lang="en" data-theme="midnight" data-accent="indigo">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preload" href="/vendor/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>

<body>
<section id="login" class="lg" hidden>
  <div class="lg-bg" aria-hidden="true"><i class="lg-blob lg-blob--a"></i><i class="lg-blob lg-blob--b"></i><i class="lg-blob lg-blob--c"></i><i class="lg-grain"></i></div>
  <form id="login-form" class="lg-card" autocomplete="off" novalidate>
    <div class="lg-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64">
        <defs>
          <linearGradient id="lg-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/></linearGradient>
        </defs>
        <rect x="14" y="17" width="36" height="24" rx="5" fill="none" stroke="url(#lg-g)" stroke-width="3.2"/>
        <path d="M9 47h46" stroke="url(#lg-g)" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="32" cy="29" r="4.2" fill="#fff"/>
      </svg>
    </div>
    <h1 class="lg-title">Laptop Hub</h1>
    <p class="lg-sub">Your laptop, in your pocket.</p>
    <div class="lg-field">
      <label for="token" class="ui-label">Login token</label>
      <div class="lg-input-wrap">
        <span class="lg-input-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><circle cx="8" cy="15.5" r="4.5"/><path d="m11.2 12.3 8.8-8.8M16.5 7l2.5 2.5M14 9.5l2 2"/></svg></span>
        <input id="token" name="token" type="password" class="ui-input--lg" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="Paste your token" aria-describedby="login-hint login-error">
        <button type="button" id="token-toggle" class="lg-eye" aria-label="Show token" aria-pressed="false">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p id="login-error" class="lg-error" role="alert" hidden></p>
    </div>
    <button class="ui-btn ui-btn--primary ui-btn--lg ui-btn--block lg-submit" id="login-submit" type="submit">
      <span>Unlock</span>
      <svg class="ui-icon" viewBox="0 0 24 24"><path d="M4.5 12h15M13.5 5.5 20 12l-6.5 6.5"/></svg>
    </button>
    <button class="ui-btn ui-btn--ghost ui-btn--block lg-paste" id="token-paste" type="button" hidden>
      <svg class="ui-icon" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16.5" rx="2.2"/><rect x="8.5" y="2.5" width="7" height="4" rx="1.3"/></svg>
      <span>Paste from clipboard</span>
    </button>
    <p id="login-hint" class="lg-hint">The token was printed by <code>python -m hub init</code> on your laptop. Run <code>python -m hub token</code> if you lost it. It is never stored on this phone; you stay signed in with a secure cookie.</p>
  </form>
  <p class="lg-foot"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7.5-3.2 7.5-9.5V5.5L12 3 4.5 5.5v6C4.5 17.8 12 21 12 21Z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg> Private link over Tailscale</p>
</section>

<div id="app" class="sh" hidden>
  <header id="appbar" class="sh-bar"></header>
  <main id="views" class="sh-views"></main>
  <nav id="tabs" class="sh-nav" aria-label="Main"></nav>
</div>

<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
