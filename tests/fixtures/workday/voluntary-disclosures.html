<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme Careers - Apply</title>
<script src="wd-mock.js" defer></script></head>
<body>
<header><a data-automation-id="utilityButtonSignIn" href="#">Acme</a></header>
<div data-automation-id="applyFlowPage">
<div data-automation-id="progressBar"><ol><li data-automation-id="progressBarCompletedStep"><div data-automation-id="progressBarBubble"></div><div><span>completed step 1 of 5</span> <label>My Information</label></div></li><li data-automation-id="progressBarCompletedStep"><div data-automation-id="progressBarBubble"></div><div><span>completed step 2 of 5</span> <label>My Experience</label></div></li><li data-automation-id="progressBarCompletedStep"><div data-automation-id="progressBarBubble"></div><div><span>completed step 3 of 5</span> <label>Application Questions</label></div></li><li data-automation-id="progressBarActiveStep"><div data-automation-id="progressBarBubble"></div><div><span>current step 4 of 5</span> <label>Voluntary Disclosures</label></div></li><li data-automation-id="progressBarInactiveStep"><div data-automation-id="progressBarBubble"></div><div><span>step 5 of 5</span> <label>Review</label></div></li></ol></div>
<h2>Voluntary Disclosures</h2>
<div data-automation-id="selfIdentifiedDisabilityData"><p>Voluntary self-identification of disability</p><div data-automation-id="formField-gender"><label id="gender-label" for="gender">Gender</label><button type="button" id="gender" aria-haspopup="listbox" aria-labelledby="gender-label gender" data-automation-id="genderDropdown" data-options="[&quot;Female&quot;, &quot;Male&quot;, &quot;Non-binary&quot;, &quot;I do not wish to answer&quot;]">Select One</button></div><div data-automation-id="formField-ethnicity"><label id="ethnicity-label" for="ethnicity">Ethnicity</label><div data-automation-id="multiSelectContainer"><div data-automation-id="selectedItemList"></div><input id="ethnicity" data-automation-id="searchBox" type="text" placeholder="Search" data-options="[&quot;Asian&quot;, &quot;White&quot;, &quot;Black&quot;, &quot;Prefer not to say&quot;]"><button type="button" data-automation-id="promptSearchButton" aria-label="Search"></button></div></div><div data-automation-id="formField-veteranStatus"><label id="veteran-label" for="veteran">Veteran Status<abbr title="required" aria-hidden="true">*</abbr></label><button type="button" id="veteran" aria-haspopup="listbox" aria-labelledby="veteran-label veteran" data-automation-id="veteranStatusDropdown" data-options="[&quot;I am a veteran&quot;, &quot;I am not a veteran&quot;, &quot;I do not wish to answer&quot;]">Select One</button></div><div data-automation-id="formField-agreeTerms"><input type="checkbox" id="terms" data-automation-id="agreeTerms"><label for="terms">I have read and agree to the terms and conditions</label></div><div data-automation-id="formField-signatureName"><label id="sigName-label" for="sigName">Name</label><div><input id="sigName" data-automation-id="signatureName" type="text"></div></div></div>
<div data-automation-id="pageFooter"><button type="button" data-automation-id="pageFooterBackButton">Back</button><button type="button" data-automation-id="pageFooterNextButton" data-next="review.html">Save and Continue</button></div>
</div>
</body></html>
