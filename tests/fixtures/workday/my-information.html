<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme Careers - Apply</title>
<script src="wd-mock.js" defer></script></head>
<body>
<header><a data-automation-id="utilityButtonSignIn" href="#">Acme</a></header>
<div data-automation-id="applyFlowPage">
<div data-automation-id="progressBar"><ol><li data-automation-id="progressBarActiveStep"><div data-automation-id="progressBarBubble"></div><div><span>current step 1 of 5</span> <label>My Information</label></div></li><li data-automation-id="progressBarInactiveStep"><div data-automation-id="progressBarBubble"></div><div><span>step 2 of 5</span> <label>My Experience</label></div></li><li data-automation-id="progressBarInactiveStep"><div data-automation-id="progressBarBubble"></div><div><span>step 3 of 5</span> <label>Application Questions</label></div></li><li data-automation-id="progressBarInactiveStep"><div data-automation-id="progressBarBubble"></div><div><span>step 4 of 5</span> <label>Voluntary Disclosures</label></div></li><li data-automation-id="progressBarInactiveStep"><div data-automation-id="progressBarBubble"></div><div><span>step 5 of 5</span> <label>Review</label></div></li></ol></div>
<h2>My Information</h2>
<div data-automation-id="formField-source"><label id="source-label" for="source">How Did You Hear About Us?<abbr title="required" aria-hidden="true">*</abbr></label><div data-automation-id="multiSelectContainer"><div data-automation-id="selectedItemList"></div><input id="source" data-automation-id="searchBox" type="text" placeholder="Search" data-options="[&quot;Job Board&quot;, &quot;Company Website&quot;, &quot;Employee Referral&quot;, &quot;Social Media&quot;]"><button type="button" data-automation-id="promptSearchButton" aria-label="Search"></button></div></div><div data-automation-id="formField-country"><label id="country-label" for="country">Country<abbr title="required" aria-hidden="true">*</abbr></label><button type="button" id="country" aria-haspopup="listbox" aria-labelledby="country-label country" data-automation-id="countryDropdown" data-options="[&quot;India&quot;, &quot;United States of America&quot;, &quot;United Kingdom&quot;, &quot;Germany&quot;]">Select One</button></div><div data-automation-id="legalNameSection"><div data-automation-id="formField-legalNameSection_firstName"><label id="first-label" for="first">First Name<abbr title="required" aria-hidden="true">*</abbr></label><div><input id="first" data-automation-id="legalNameSection_firstName" type="text"></div></div><div data-automation-id="formField-legalNameSection_lastName"><label id="last-label" for="last">Last Name<abbr title="required" aria-hidden="true">*</abbr></label><div><input id="last" data-automation-id="legalNameSection_lastName" type="text"></div></div></div><div data-automation-id="addressSection"><div data-automation-id="formField-addressSection_addressLine1"><label id="addr1-label" for="addr1">Address Line 1<abbr title="required" aria-hidden="true">*</abbr></label><div><input id="addr1" data-automation-id="addressSection_addressLine1" type="text"></div></div><div data-automation-id="formField-addressSection_city"><label id="city-label" for="city">City<abbr title="required" aria-hidden="true">*</abbr></label><div><input id="city" data-automation-id="addressSection_city" type="text"></div></div><div data-automation-id="formField-addressSection_countryRegion"><label id="state-label" for="state">State<abbr title="required" aria-hidden="true">*</abbr></label><button type="button" id="state" aria-haspopup="listbox" aria-labelledby="state-label state" data-automation-id="addressSection_countryRegionDropdown" data-options="[&quot;Karnataka&quot;, &quot;Maharashtra&quot;, &quot;Tamil Nadu&quot;]">Select One</button></div><div data-automation-id="formField-addressSection_postalCode"><label id="postal-label" for="postal">Postal Code<abbr title="required" aria-hidden="true">*</abbr></label><div><input id="postal" data-automation-id="addressSection_postalCode" type="text"></div></div></div><div data-automation-id="phoneSection"><div data-automation-id="formField-phone-device-type"><label id="devtype-label" for="devtype">Phone Device Type<abbr title="required" aria-hidden="true">*</abbr></label><button type="button" id="devtype" aria-haspopup="listbox" aria-labelledby="devtype-label devtype" data-automation-id="phone-device-typeDropdown" data-options="[&quot;Mobile&quot;, &quot;Landline&quot;]">Select One</button></div><div data-automation-id="formField-countryPhoneCode"><label id="pcode-label" for="pcode">Country Phone Code<abbr title="required" aria-hidden="true">*</abbr></label><div data-automation-id="multiSelectContainer"><div data-automation-id="selectedItemList"></div><input id="pcode" data-automation-id="searchBox" type="text" placeholder="Search" data-options="[&quot;India (+91)&quot;, &quot;United States of America (+1)&quot;, &quot;United Kingdom (+44)&quot;]"><button type="button" data-automation-id="promptSearchButton" aria-label="Search"></button></div></div><div data-automation-id="formField-phone-number"><label id="phone-label" for="phone">Phone Number<abbr title="required" aria-hidden="true">*</abbr></label><div><input id="phone" data-automation-id="phone-number" type="text"></div></div><div data-automation-id="formField-phone-extension"><label id="phoneext-label" for="phoneext">Phone Extension</label><div><input id="phoneext" data-automation-id="phone-extension" type="text"></div></div></div>
<div data-automation-id="pageFooter"><button type="button" data-automation-id="pageFooterNextButton" data-next="my-experience.html">Save and Continue</button></div>
</div>
</body></html>
