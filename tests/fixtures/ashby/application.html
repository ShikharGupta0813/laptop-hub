<!doctype html>
<html><head><title>Python Developer - Acme Test</title></head><body>
<h1>Python Developer</h1>
<form class="ashby-application-form-container" action="/submit" method="post">
  <div class="ashby-application-form-section-container">
    <h2 class="_title_1">Application</h2>
    <button type="button" class="_autofill_1">Autofill from resume</button>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="_systemfield_name">Name<span class="_required_1"> *</span></label>
      <input class="_input_1" id="_systemfield_name" name="_systemfield_name" type="text" required></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="_systemfield_email">Email<span> *</span></label>
      <input class="_input_1" id="_systemfield_email" name="_systemfield_email" type="email" required></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="phone">Phone</label>
      <input class="_input_1" id="phone" name="phone" type="tel"></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="_systemfield_resume">Resume<span> *</span></label>
      <input id="_systemfield_resume" name="_systemfield_resume" type="file" required></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="loc">Current location<span> *</span></label>
      <div class="_container_1"><input id="loc" class="_select_1" role="combobox" aria-haspopup="listbox" aria-autocomplete="list" aria-required="true" data-search="1"
        data-options='["Pune, India","Mumbai, India","Bengaluru, India"]'></div></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="li">LinkedIn URL</label>
      <input class="_input_1" id="li" name="li" type="url"></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="src">How did you hear about us?</label>
      <div class="_container_1"><input id="src" class="_select_1" role="combobox" aria-haspopup="listbox" data-valuebox="src-value"
        data-options='["Referral","Company Website","Job Board","Other"]'><div class="_singleValue_1" id="src-value"></div></div></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1">Are you willing to relocate?<span> *</span></label>
      <div class="_yesno_1"><button type="button" class="_option_1" data-yesno="1">Yes</button><button type="button" class="_option_1" data-yesno="1">No</button></div></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1">Are you legally authorized to work in India?<span> *</span></label>
      <div class="_yesno_1"><button type="button" class="_option_1" data-yesno="1">Yes</button><button type="button" class="_option_1" data-yesno="1">No</button></div></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1">Do you have a friend working here?</label>
      <div class="_yesno_1"><button type="button" class="_option_1" data-yesno="1">Yes</button><button type="button" class="_option_1" data-yesno="1">No</button></div></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="notice">What is your notice period?</label>
      <input class="_input_1" id="notice" name="notice" type="text"></div>
  </div>
  <div class="ashby-application-form-field-entry"><input type="checkbox" id="priv" required><label for="priv">I agree to the privacy policy</label></div>
  <div class="ashby-application-form-section-container">
    <h2 class="_title_1">Equal Employment Opportunity (voluntary)</h2>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="pron">Preferred pronouns</label><input id="pron" name="pron" type="text"></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="vet">Veteran status</label>
      <select id="vet" name="vet"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
    <div class="ashby-application-form-field-entry"><label class="_heading_1" for="free">Anything else you want to share about yourself?</label><input id="free" name="free" type="text"></div>
  </div>
  <button type="submit" class="_submit_1" data-submit="1">Submit Application</button>
</form>
<script src="/ad-mock.js"></script>
</body></html>
