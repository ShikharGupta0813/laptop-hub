<!doctype html>
<html><head><title>Apply</title></head><body class="iCIMS_Body">
<div class="iCIMS_MainWrapper iCIMS_Main">
<h1 class="iCIMS_Header">Personal Information</h1>
<div class="iCIMS_InfoMsg">Step 1 of 3</div>
<form id="icims_form" action="/submit" method="post" onsubmit="return false">
 <div class="iCIMS_FormRow"><label for="PersonProfileFields.FirstName">First Name *</label><input id="PersonProfileFields.FirstName" name="fn" type="text" class="iCIMS_TextInput" required></div>
 <div class="iCIMS_FormRow"><label for="PersonProfileFields.LastName">Last Name *</label><input id="PersonProfileFields.LastName" name="ln" type="text" class="iCIMS_TextInput" required></div>
 <div class="iCIMS_FormRow"><label for="PersonProfileFields.Email">Email *</label><input id="PersonProfileFields.Email" name="em" type="text" class="iCIMS_TextInput" required></div>
 <div class="iCIMS_FormRow"><label for="PersonProfileFields.Phone">Phone</label><input id="PersonProfileFields.Phone" name="ph" type="text" class="iCIMS_TextInput"></div>
 <div class="iCIMS_FormRow"><label for="PersonProfileFields.Country">Country *</label>
   <select id="PersonProfileFields.Country" name="co" required><option value="">Select</option><option value="IN">India</option><option value="US">United States</option></select></div>
 <div class="iCIMS_FormRow"><label for="PersonProfileFields.Source">How did you hear about us?</label>
   <select id="PersonProfileFields.Source" name="src"><option value="">Select</option><option value="jb">Job Board</option><option value="cw">Company Website</option></select></div>
 <div class="iCIMS_FormRow"><label for="PersonProfileFields.Resume">Resume</label><input id="PersonProfileFields.Resume" name="cv" type="file"></div>
 <div class="iCIMS_FormRow"><label for="PersonProfileFields.Sal">Previous Salary</label><input id="PersonProfileFields.Sal" name="sal" type="text"></div>
 <div class="iCIMS_FormRow"><input type="checkbox" id="terms" name="terms"><label for="terms">I agree to the terms of use</label></div>
 <div class="iCIMS_Buttons"><input type="button" class="iCIMS_Button" value="Back" data-next="frame-login.html"><input type="button" class="iCIMS_Button" value="Next" data-next="frame-review.html"></div>
</form></div>
<script src="/ad-mock.js"></script>
</body></html>
